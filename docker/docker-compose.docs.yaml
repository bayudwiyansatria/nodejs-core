name: templates-project-nodejs
services:
  app-docs:
    image: bayudwiyansatria/templates-project-nodejs:docs
    build:
      context: ../
      # Bug: https://github.com/orgs/community/discussions/26634
      args: []
      #dockerfile: Dockerfile
      dockerfile: docker/docs.Dockerfile
    container_name: templates-project-nodejs-docs
    ports:
      - "80:80"
    networks:
      - app-network
    env_file: []
volumes: {}
networks:
  app-network:
    driver: bridge
