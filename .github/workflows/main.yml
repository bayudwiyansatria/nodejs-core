name: Main
on:
  push:
    branches:
      - master
jobs:
  #---------------------------------------------------------------------------------------------------------------------
  # Code Analysis: Secret Detection
  #---------------------------------------------------------------------------------------------------------------------
  secret-detection:
    name: Secret Detection
    uses: bayudwiyansatria/.github/.github/workflows/code-analysis-secret.yml@master
  #---------------------------------------------------------------------------------------------------------------------
  # Build
  #---------------------------------------------------------------------------------------------------------------------
  build:
    name: Build
    needs:
      - secret-detection
    uses: bayudwiyansatria/.github/.github/workflows/build-node-npm.yml@master
    with:
      NODE_VERSION: 22
    secrets:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
  #---------------------------------------------------------------------------------------------------------------------
  # Build: Documentation
  #---------------------------------------------------------------------------------------------------------------------
  docs:
    name: Docs
    needs:
      - build
    uses: bayudwiyansatria/.github/.github/workflows/build-node-docs.yml@master
    with:
      NODE_VERSION: 22
    secrets:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
  #---------------------------------------------------------------------------------------------------------------------
  # Test
  #---------------------------------------------------------------------------------------------------------------------
  test:
    name: Test
    needs:
      - build
    uses: bayudwiyansatria/.github/.github/workflows/test-node-npm.yml@master
    with:
      NODE_VERSION: 22
    secrets:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  #---------------------------------------------------------------------------------------------------------------------
  # Code Analysis: Coverage
  #---------------------------------------------------------------------------------------------------------------------
  code-quality:
    name: Code Quality
    needs:
      - test
    uses: bayudwiyansatria/.github/.github/workflows/code-analysis-codecov.yml@master
    with:
      ARTIFACT_NAME: coverage
      ARTIFACT_PATH: dist/coverage
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
